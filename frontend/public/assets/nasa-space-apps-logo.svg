<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <defs>
    <linearGradient id="spaceAppsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D91" />
      <stop offset="50%" stop-color="#1E5BB5" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="60" cy="60" r="50" fill="#060B19" stroke="url(#spaceAppsGrad)" stroke-width="2.5" />
  
  <!-- Planet Globe Grid Lines -->
  <ellipse cx="60" cy="60" rx="42" ry="42" stroke="#1A3A68" stroke-width="1" fill="none" opacity="0.6"/>
  <ellipse cx="60" cy="60" rx="22" ry="42" stroke="#00D2FF" stroke-width="1.2" fill="none" opacity="0.7"/>
  <line x1="18" y1="60" x2="102" y2="60" stroke="#00D2FF" stroke-width="1.2" opacity="0.7"/>
  <line x1="24" y1="40" x2="96" y2="40" stroke="#1A3A68" stroke-width="1" opacity="0.6"/>
  <line x1="24" y1="80" x2="96" y2="80" stroke="#1A3A68" stroke-width="1" opacity="0.6"/>

  <!-- Orbital Ring -->
  <ellipse cx="60" cy="60" rx="48" ry="18" stroke="#FC3D21" stroke-width="2" fill="none" transform="rotate(-28 60 60)" filter="url(#glow)"/>
  
  <!-- NASA Meatball Insignia Stylized Red Vector Chevron -->
  <path d="M 40 70 L 60 38 L 80 70 L 68 62 L 60 48 L 52 62 Z" fill="#FC3D21" />

  <!-- Stars -->
  <circle cx="36" cy="36" r="1.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="84" cy="38" r="1.2" fill="#00E5FF" opacity="0.9" />
  <circle cx="42" cy="84" r="1.2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="80" cy="80" r="1.5" fill="#FF7A00" opacity="0.9" />

  <!-- Typography: NASA SPACE APPS CHALLENGE -->
  <text x="125" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="2">NASA SPACE APPS</text>
  <text x="125" y="74" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#00D2FF" letter-spacing="4">CHALLENGE</text>
  <text x="125" y="98" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="11" fill="#88A0C0" letter-spacing="1.5">GLOBAL HACKATHON INITIATIVE</text>
</svg>
